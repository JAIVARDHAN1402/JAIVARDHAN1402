<radialGradient id="hero-glow" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#0d0e16" stop-opacity="0"/></radialGradient>
</defs>
